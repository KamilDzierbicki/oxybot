# LiteLLM aliases used by OxyBot (docker compose --profile ai up). Rails never names a provider:
# to move a task to another model, change it here.
#
# Every paid alias has a daily spend cap; past it LiteLLM answers 429 instead of calling the provider,
# so a retry loop cannot burn the month's budget. OxyBot also sends the tenant as the end user
# ("account-42"), so LiteLLM shows spend per tenant.
model_list:
  # Splits raw feedback into insights: many calls, short output, so a fast model
  - model_name: oxybot-extract
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_budget: 3 # USD
      budget_duration: 1d

  # Picks the matching feature among a few candidates
  - model_name: oxybot-judge
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_budget: 2
      budget_duration: 1d

  # The product assistant (tool use, longer reasoning)
  - model_name: oxybot-spark
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_budget: 5
      budget_duration: 1d
      cache_control_injection_points:
        - location: message
          role: system

  # Writes and revises documents (specs, reports, release notes, launch reviews)
  - model_name: oxybot-writer
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_budget: 5
      budget_duration: 1d
      cache_control_injection_points:
        - location: message
          role: system

  # A cheap general alias, handy for testing every task on Haiku (pick it per task in AI settings)
  - model_name: oxybot-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      max_budget: 3
      budget_duration: 1d

  # Local embeddings (768 dimensions, matching insights.embedding and features.embedding), no key needed.
  # The app adds nomic's "search_document:" / "search_query:" prefixes itself.
  - model_name: oxybot-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE

litellm_settings:
  callbacks: ["langfuse_otel"]
  # Traces keep timings, tokens and cost but not the text: feedback is personal data and Langfuse keeps it separately.
  # Set to false only if you accept customer text in Langfuse and give it a retention period.
  turn_off_message_logging: true
  num_retries: 2
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
