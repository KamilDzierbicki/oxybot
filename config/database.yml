# Postgres with pgvector runs in compose.yml (docker compose up -d db) on port 5435.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5435) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

# Development uses Solid Queue and Solid Cable like production: assistant replies are broadcast
# from the job worker process, and the in-process async cable adapter would never reach the browser.
development:
  primary:
    <<: *default
    database: oxybot_development
  queue:
    <<: *default
    database: oxybot_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: oxybot_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: oxybot_test

production:
  primary: &primary_production
    <<: *default
    database: oxybot_production
    username: oxybot
    password: <%= ENV["OXYBOT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: oxybot_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: oxybot_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: oxybot_production_cable
    migrations_paths: db/cable_migrate
