# Recurring jobs run by Solid Queue's scheduler (bin/dev in development, bin/jobs in production).
default: &default
  sync_hubspot:
    class: SyncHubspotJob
    queue: default
    schedule: every hour at minute 17
  opportunity_discovery:
    class: OpportunityDiscoveryJob
    queue: default
    schedule: every monday at 7:43am

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
